<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadowing Feedback V6</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--panel2:#0f1218;--line:#2b3140;--text:#f2f4f8;--muted:#9da5b5;--accent:#7c3aed;--green:#20c77a;--yellow:#eab308;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1050px;margin:32px auto;padding:0 18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 10px 30px #0005}
h1{margin:0 0 6px;font-size:25px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:18px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px;font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}textarea{min-height:180px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:11px 17px;font-weight:800;color:white;background:#292f3b;cursor:pointer}
button.primary{background:var(--accent)}button.danger{background:#242a35}button:hover{filter:brightness(1.08)}
.status{margin-top:12px;color:var(--muted);font-size:12px}.result{margin-top:18px;display:none}
pre{white-space:pre-wrap;word-wrap:break-word;background:#080a0e;border:1px solid var(--line);border-radius:10px;padding:18px;font:14px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace}
.history{margin-top:18px}.history-item{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.history-item small{color:var(--muted)}.history-item button{padding:7px 10px;font-size:12px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Shadowing Feedback V6</h1>
<div class="sub">
Feedback compact pentru QC/management. Reformulează observațiile în termeni de chatting/OnlyFans, fără copy-paste. Exact 3 puncte bune, 3 puncte de îmbunătățit și 3 action points. Istoricul rămâne salvat în browser.
</div>

<div class="grid">
<div><label>Nume</label><input id="name" placeholder="ex. Monu"></div>
<div><label>Echipă</label><input id="team" placeholder="ex. Werewolves"></div>
</div>

<label>Observații shadowing</label>
<textarea id="notes" placeholder="Scrie liber ce ai observat: ce face bine, unde se pierde, ce s-a schimbat față de data trecută, ce trebuie lucrat etc."></textarea>

<div class="actions">
<button class="primary" onclick="generate()">GENERATE</button>
<button onclick="copyResult()">COPY</button>
<button class="danger" onclick="clearAll()">CLEAR</button>
</div>
<div class="status" id="status"></div>

<div class="result" id="result">
<pre id="output"></pre>
</div>

<div class="history">
<label>Istoric</label>
<div id="history"></div>
</div>
</div>
</div>

<script>
const KEY='shadowing_feedback_v6_history';

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function uniq(a){return [...new Set(a.filter(Boolean))]}

function has(n, patterns){
  return patterns.some(p => p instanceof RegExp ? p.test(n) : n.includes(p));
}

function summarize(notes){
  const n=norm(notes);
  let good=[], bad=[], actions=[];

  // GOOD: extract only the strongest QC-relevant observations.
  if(has(n,[/receptiv/,/asculta ce/,/baga la cap/,/implementeaza/,/aplica feedback/]))
    good.push('Este receptiv la feedback și implementează rapid corecțiile.');
  if(has(n,[/follow.?up/,/dupa ppv/,/ppv/]))
    good.push('Are follow-up-urile după PPV bine integrate în workflow.');
  if(has(n,[/tab nou/,/deschide fan.*tab/,/revina mai repede/]))
    good.push('Gestionează bine follow-up-ul și revine rapid la fanii activi.');
  if(has(n,[/\bgfe\b/,/gfe o gramada/,/face gfe/]))
    good.push('Se descurcă bine pe GFE și menține conversația personală.');
  if(has(n,[/rapid/,/foarte rapid/]))
    good.push('Are un ritm bun de lucru și gestionează rapid conversațiile.');
  if(has(n,[/prioritiz/,/fani.*priorit/,/stie.*priorit/]))
    good.push('Înțelege prioritizarea fanilor în funcție de potențialul de vânzare.');
  if(has(n,[/din ce in ce mai bine/,/mai bine/,/improvement/,/evolut/,/progres/]))
    good.push('Se observă o evoluție pozitivă față de perioada anterioară.');

  // BAD: identify actual performance gaps, not rephrased positives.
  if(has(n,[/nu.*activitate/,/nu prea.*activitate/,/inceputul turei/,/engagement/]))
    bad.push('Trebuie să creeze mai mult engagement și activitate la începutul turei.');
  if(has(n,[/\bsales\b/,/vanzar/,/vânzar/,/nu.*deschide sales/,/nu prea deschide sales/]))
    bad.push('Are nevoie de mai mult focus pe Sales și direcționarea conversației spre vânzare.');
  if(has(n,[/transactional/,/tranzactional/,/tranzacțional/,/doar.*flow/,/fanul.*controle/,/controleze el conversatia/]))
    bad.push('Trebuie să preia mai mult controlul conversației și să evite abordarea tranzacțională.');
  if(has(n,[/discount/,/discounturi/,/sara.*discount/,/sare.*discount/]))
    bad.push('Trebuie să evite discounturile ca soluție rapidă pentru închiderea vânzării.');
  if(has(n,[/empatie/,/lipseste.*empatie/,/nu are.*empatie/]))
    bad.push('Mai are de lucrat la empatie și la construirea unei conexiuni reale cu fanul.');
  if(has(n,[/creativitate/,/nu are creativitate/,/scrie din cap/,/texte.*discord/]))
    bad.push('Are nevoie de mai multă creativitate în formularea mesajelor și GFE.');
  if(has(n,[/manipulare/,/manipulation/]))
    bad.push('Mai are nevoie de practică pe partea de sales și manipulation.');
  if(has(n,[/scamming/]))
    bad.push('Mai are nevoie de practică pe situațiile de SCAMMING.');
  if(has(n,[/se pierde/,/se bloche/,/frica/,/teama/,/fan.*tare/,/situatii dificile/]))
    bad.push('Are nevoie de mai multă siguranță în situațiile dificile.');

  // De-duplicate ideas that overlap.
  bad = uniq(bad);

  // ACTIONS: convert gaps into concrete next steps.
  if(has(n,[/\bsales\b/,/vanzar/,/vânzar/,/transactional/,/tranzactional/,/fanul.*controle/]))
    actions.push('Deschide Sales și stabilește direcția de vânzare înainte de a urma flow-ul fanului.');
  if(has(n,[/\bgfe\b/,/empatie/,/creativitate/]))
    actions.push('Folosește GFE pentru conexiune, apoi mută conversația natural spre sales.');
  if(has(n,[/discount/,/sara.*discount/,/sare.*discount/]))
    actions.push('Evită discounturile ca soluție rapidă și lucrează pe value + objection handling.');
  if(has(n,[/nu.*activitate/,/engagement/,/inceputul turei/]))
    actions.push('Începe tura cu outreach personalizat către platitori și creează activitate constantă.');
  if(has(n,[/follow.?up/,/ppv/]))
    actions.push('Menține follow-up-urile după PPV și revino rapid la fanii activi.');
  if(has(n,[/manipulare/,/manipulation/]))
    actions.push('Continuă practica pe sales și manipulation în conversații reale.');
  if(has(n,[/scamming/]))
    actions.push('Continuă practica pe SCAMMING și aplică feedback-ul în situații reale.');
  if(has(n,[/receptiv/,/implementeaza/,/feedback/]))
    actions.push('Continuă să aplici feedback-ul direct în conversații și în următorul shadowing.');

  // Keep the output stable and useful even when the input is short.
  while(good.length<3) good.push(
    good.length===0 ? 'Workflow-ul este în curs de evaluare.' :
    good.length===1 ? 'Are o bază bună de lucru și poate construi pe feedback.' :
    'Se observă o evoluție pozitivă în modul de lucru.'
  );
  while(bad.length<3) bad.push(
    bad.length===0 ? 'Mai este nevoie de consistență în execuție.' :
    'Mai are nevoie de consolidare pe partea de performance.'
  );
  while(actions.length<3) actions.push(
    actions.length===0 ? 'Continuăm monitorizarea și corectarea punctuală.' :
    'Aplică feedback-ul în conversații reale și reevaluăm la următorul shadowing.'
  );

  return {
    good: uniq(good).slice(0,3),
    bad: uniq(bad).slice(0,3),
    actions: uniq(actions).slice(0,3)
  };
}

function detectProgress(notes, prev){
  if(!prev) return 'FIRST SHADOWING';
  const n=norm(notes);
  if(/regres|mai rau|mai rău|worse|inrautat|înrăutăț|decline|scade|scazut/.test(n)) return 'DECLINE';
  if(/stagn|la fel|tot aceeasi|tot aceeași|nu s.?a schimbat|fara progres|fără progres|sta pe loc|stă pe loc/.test(n)) return 'STAGNANT';
  if(/improv|mai bine|progres|evolut|se descurca mai bine|se descurcă mai bine|din ce in ce mai bine|din ce în ce mai bine|increase|mai ok|mai okay/.test(n))
    return 'IMPROVEMENT';
  return 'STAGNANT';
}

function overall(progress, notes){
  if(progress==='FIRST SHADOWING') return 'Primul shadowing oferă un punct clar de plecare pentru următoarea evaluare.';
  if(progress==='IMPROVEMENT') return 'Se observă progres și o evoluție pozitivă față de evaluarea anterioară.';
  if(progress==='DECLINE') return 'Se observă un regres față de evaluarea anterioară; focus pe punctele de mai jos.';
  return 'Progresul este limitat; următoarea evaluare trebuie să confirme schimbarea.';
}

function potential(notes){
  const n=norm(notes);
  if(/1[,.]?5k/.test(n) && /800|1k/.test(n))
    return 'Momentan nu este la nivelul de $1.5k; $800–$1k rămâne un target realist dacă progresul se menține.';
  if(/potential|target|tinta|ținta/.test(n)){
    const m=notes.match(/\$?\s*[\d.,]+\s*(?:[-–]\s*\$?\s*[\d.,]+)?\s*k?/i);
    if(m) return 'Targetul menționat rămâne de urmărit în funcție de consistență și rezultate.';
  }
  return 'Reevaluăm potențialul după următoarele shadowing-uri.';
}

function line(arr){return arr.map(x=>'• '+x).join('\n')}

function generate(){
  const name=document.getElementById('name').value.trim();
  const team=document.getElementById('team').value.trim();
  const notes=document.getElementById('notes').value.trim();
  if(!name||!team||!notes){document.getElementById('status').textContent='Completează numele, echipa și descrierea.';return}

  const all=load(), key=norm(name)+'|'+norm(team), old=all[key];
  const d=summarize(notes), progress=detectProgress(notes,old?.latest);

  const out=`SHADOWING FEEDBACK

Nume: ${name}
Echipă: ${team}

Overall:
${overall(progress,notes)}

📈 Progress: ${progress}

✅ Puncte bune
${line(d.good)}

⚠️ De îmbunătățit
${line(d.bad)}

🎯 Action Point
${line(d.actions)}

💰 Potential:
${'• '+potential(notes)}`;

  document.getElementById('output').textContent=out;
  document.getElementById('result').style.display='block';
  document.getElementById('status').textContent='Feedback generat și salvat.';

  all[key]={
    name,team,
    latest:{notes,progress,good:d.good,bad:d.bad,actions:d.actions,date:new Date().toISOString()},
    history:[...(old?.history||[]),{notes,progress,date:new Date().toISOString()}].slice(-20)
  };
  save(all); renderHistory();
}

function copyResult(){
  const text=document.getElementById('output').textContent;
  if(!text)return;
  navigator.clipboard?.writeText(text);
  document.getElementById('status').textContent='Copiat.';
}

function clearAll(){
  ['name','team','notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('output').textContent='';
  document.getElementById('result').style.display='none';
  document.getElementById('status').textContent='';
}

function renderHistory(){
  const box=document.getElementById('history'), all=load();
  const items=Object.values(all).sort((a,b)=>new Date(b.latest.date)-new Date(a.latest.date));
  if(!items.length){box.innerHTML='<small style="color:#9da5b5">Niciun chatter salvat încă.</small>';return}
  box.innerHTML=items.map((x,i)=>`<div class="history-item"><div><b>${escapeHtml(x.name)}</b> · ${escapeHtml(x.team)}<br><small>${escapeHtml(x.latest.progress)} · ${new Date(x.latest.date).toLocaleDateString('ro-RO')}</small></div><button onclick="loadPerson(${i})">LOAD</button></div>`).join('');
  window.__hist=items;
}
function loadPerson(i){
  const x=window.__hist[i];
  document.getElementById('name').value=x.name;
  document.getElementById('team').value=x.team;
  document.getElementById('notes').value='';
  document.getElementById('output').textContent='';
  document.getElementById('result').style.display='none';
  document.getElementById('status').textContent='Chatter încărcat. Introdu noul shadowing.';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
renderHistory();
</script>
</body>
</html>
