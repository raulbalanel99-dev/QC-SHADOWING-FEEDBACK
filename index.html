<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Shadowing Feedback V7</title>
<style>
:root{--bg:#0d1117;--card:#151b24;--card2:#0b1016;--border:#293241;--text:#eef2f7;--muted:#9aa6b5;--blue:#7c9cff;--green:#35d07f;--yellow:#ffbd55;--red:#ff6577}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
.app{max-width:1250px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px}.side{min-height:650px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sidehead b{font-size:14px}.count{font-size:11px;color:var(--muted)}
.search,input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font:inherit;outline:none}.search{margin-bottom:10px}
.profile{padding:11px;border:1px solid transparent;border-radius:9px;cursor:pointer;margin:5px 0}.profile:hover{background:#101721;border-color:var(--border)}.profile.active{background:#202a3a;border-color:#46577a}.profile b{display:block}.profile small{color:var(--muted)}.tag{display:inline-block;margin-top:5px;font-size:10px;padding:2px 6px;border-radius:20px;background:#263149;color:#b9c8ff}
label{font-size:12px;font-weight:700;color:#cbd4df;display:block;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
textarea{min-height:180px;resize:vertical;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:9px 13px;background:#273149;color:#fff;font-weight:800;cursor:pointer}button.primary{background:var(--blue);color:#08101f}button.danger{background:#3b2029;color:#ffbdc6}button.ghost{background:transparent;border:1px solid var(--border)}
.result{margin-top:14px;background:#090d12;border:1px solid var(--border);border-radius:10px;padding:17px;white-space:pre-wrap;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:280px}
.timeline{margin-top:16px}.entry{border:1px solid var(--border);border-radius:10px;background:var(--card2);margin-top:9px;overflow:hidden}.entryhead{display:flex;justify-content:space-between;padding:11px 13px;background:#121923}.entryhead b{font-size:13px}.entryhead span{font-size:11px;color:var(--muted)}.entrybody{padding:12px}.entrybody pre{white-space:pre-wrap;margin:0;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.compare{border-left:3px solid var(--blue);padding:8px 11px;margin-top:10px;color:#cbd5e5;font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}.status{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{min-height:auto}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div><h1>SHADOWING FEEDBACK V7</h1><p>QC history — fiecare chatter are propriul profil și timeline.</p></div></div>
 <div class="layout">
  <aside class="card side">
   <div class="sidehead"><b>Chatter History</b><span class="count" id="count">0</span></div>
   <input class="search" id="search" placeholder="Caută chatter sau echipă..." oninput="renderProfiles()">
   <button class="primary" style="width:100%" onclick="newProfile()">+ New Chatter</button>
   <div id="profiles"></div>
  </aside>

  <main>
   <section class="card">
    <div class="grid">
     <div><label>Nume</label><input id="name" placeholder="ex. Dutzi"></div>
     <div><label>Echipă</label><input id="team" placeholder="ex. Outlaws"></div>
     <div><label>Data feedback</label><input id="date" type="date"></div>
     <div><label>Potential / target (opțional)</label><input id="potential" placeholder="ex. $800–$1k"></div>
     <div class="full"><label>Observațiile tale</label>
      <textarea id="notes" placeholder="Scrie liber ce ai observat. Nu trebuie să fie profesional sau structurat. Tool-ul extrage ideile și le reformulează în termeni QC/OnlyFans."></textarea>
     </div>
    </div>
    <div class="row">
      <button class="primary" onclick="generate()">Generează</button>
      <button onclick="saveFeedback()">Save Feedback</button>
      <button class="ghost" onclick="clearForm()">Clear</button>
    </div>
    <div id="status" class="status"></div>
   </section>

   <section class="card">
    <label>Rezultat</label>
    <div id="result" class="result">Aici va apărea feedback-ul.</div>
    <div class="row"><button onclick="copyResult()">Copy</button></div>
   </section>

   <section class="card timeline">
    <div class="sidehead"><b id="timelineTitle">Istoric chatter</b><span class="count" id="timelineCount"></span></div>
    <div id="timeline" class="empty">Selectează un chatter din stânga.</div>
   </section>
  </main>
 </div>
</div>

<script>
const KEY="QC_SHADOWING_V7_DATA";
let data=load(), currentId=null, generated="", generatedCompare="";

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{"profiles":[]}')}catch(e){return{profiles:[]}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function val(id){return document.getElementById(id).value.trim()}
function set(id,v){document.getElementById(id).value=v||""}
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById("date").value=today();

function profile(name,team){
 return data.profiles.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.team.toLowerCase()===team.toLowerCase())
}
function newProfile(){currentId=null;clearForm();document.getElementById("name").focus();renderProfiles();renderTimeline()}
function clearForm(){set("name","");set("team","");set("date",today());set("potential","");set("notes","");generated="";generatedCompare="";document.getElementById("result").textContent="Aici va apărea feedback-ul.";document.getElementById("status").textContent=""}
function getCurrent(){return data.profiles.find(p=>p.id===currentId)}

function renderProfiles(){
 const q=document.getElementById("search").value.toLowerCase(), box=document.getElementById("profiles");
 let ps=data.profiles.filter(p=>(p.name+" "+p.team).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById("count").textContent=data.profiles.length;
 if(!ps.length){box.innerHTML='<div class="empty">Niciun chatter salvat.</div>';return}
 box.innerHTML=ps.map(p=>`<div class="profile ${p.id===currentId?'active':''}" onclick="openProfile('${p.id}')"><b>${esc(p.name)}</b><small>${esc(p.team)}</small><br><span class="tag">${p.feedbacks.length} feedback${p.feedbacks.length===1?'':'uri'}</span></div>`).join("");
}
function openProfile(id){
 currentId=id; const p=getCurrent(); if(!p)return;
 set("name",p.name);set("team",p.team);set("date",today());set("potential","");
 set("notes","");generated="";document.getElementById("result").textContent="Aici va apărea feedback-ul.";
 document.getElementById("status").textContent="Profil încărcat. Feedback-ul nou va fi adăugat în același istoric.";
 renderProfiles();renderTimeline();
}
function renderTimeline(){
 const p=getCurrent(), box=document.getElementById("timeline");
 if(!p){document.getElementById("timelineTitle").textContent="Istoric chatter";document.getElementById("timelineCount").textContent="";box.innerHTML='<div class="empty">Selectează un chatter din stânga.</div>';return}
 document.getElementById("timelineTitle").textContent=`${p.name} — ${p.team}`;
 document.getElementById("timelineCount").textContent=`${p.feedbacks.length} evaluări`;
 if(!p.feedbacks.length){box.innerHTML='<div class="empty">Nu există feedback-uri încă.</div>';return}
 const fs=[...p.feedbacks].sort((a,b)=>b.date.localeCompare(a.date));
 box.innerHTML=fs.map((f,i)=>`<div class="entry"><div class="entryhead"><b>${esc(f.date)}</b><span>${i===fs.length-1?'FIRST / oldest':''}</span></div><div class="entrybody"><pre>${esc(f.result)}</pre>${f.compare?`<div class="compare">↗ ${esc(f.compare)}</div>`:''}</div></div>`).join("");
}

function generate(){
 const name=val("name"),team=val("team"),notes=val("notes"),date=val("date")||today(),potential=val("potential");
 if(!name||!team||!notes){document.getElementById("status").textContent="Completează numele, echipa și observațiile.";return}
 let p=profile(name,team);
 if(!p){p={id:uid(),name,team,feedbacks:[]};data.profiles.push(p)}
 currentId=p.id;

 const t=notes.toLowerCase(), prev=[...p.feedbacks].sort((a,b)=>b.date.localeCompare(a.date)).find(x=>x.date<date);
 let good=[],bad=[];
 const add=(arr,x)=>{if(!arr.includes(x))arr.push(x)};
 if(/rapid|repede|timely|la timp|timp util/.test(t))add(good,"Răspunde rapid și menține conversațiile active.");
 if(/follow.?up/.test(t))add(good,"Folosește follow-up-urile bine și revine la fanii activi.");
 if(/receptiv|ascult|implemente|baga la cap|învață|invata/.test(t))add(good,"Este receptiv la feedback și aplică rapid corecțiile.");
 if(/gfe|empatie|personalizat|creativ/.test(t))add(good,"Construiește conexiune și folosește GFE/personalizare.");
 if(/priorit|platitor|plătitor|vip|spender/.test(t))add(good,"Înțelege mai bine prioritizarea fanilor și alocă efortul corect.");
 if(/script/.test(t))add(good,"Folosește scripturile ca suport și le adaptează mai bine conversației.");
 if(/sales|vanzar|vânzar|ppv|obj|obiectiv/.test(t))add(good,"Are o direcție mai bună pe flow, OBJ și zona de sales.");
 if(/activitate|activ\b|mesaje personalizate/.test(t))add(good,"Creează activitate și caută oportunități de engagement.");

 if(/inactiv|nu prea a fost activitate|fără activitate|fara activitate/.test(t))add(bad,"Trebuie să creeze mai multă activitate la începutul turei.");
 if(/empatie|gfe|creativitate|din cap|tranzacțional|tranzactional/.test(t))add(bad,"Trebuie să fie mai natural, empatic și mai puțin tranzacțional.");
 if(/sales|vanzar|vânzar/.test(t))add(bad,"Trebuie să folosească SALES pentru a controla mai bine direcția conversației.");
 if(/nu deschide sales|nu prea deschide sales/.test(t))add(bad,"Trebuie să verifice SALES înainte de a urma strict flow-ul fanului.");
 if(/scam|scamming/.test(t))add(bad,"Mai are nevoie de practică pe scenarii de SCAMMING.");
 if(/manipul|conving|obiec/.test(t))add(bad,"Mai are nevoie de lucru pe persuasion și gestionarea obiecțiilor.");
 if(/discount|reducere/.test(t))add(bad,"Să evite discountul ca soluție rapidă pentru închiderea vânzării.");
 if(/se pierde|bloche|frica|teamă|teama|overwhelmed/.test(t))add(bad,"Mai are nevoie de consistență când conversația devine dificilă.");
 if(/adapt/.test(t))add(bad,"Trebuie să adapteze mai bine conversația la fan.");

 const fallbackGood=["Are o bază bună de lucru.","Se adaptează din ce în ce mai bine la workflow.","Are o evoluție pozitivă."];
 const fallbackBad=["Mai are nevoie de consistență în situațiile dificile.","Trebuie să adapteze mai bine conversația la fan.","Mai este nevoie de practică pentru a transforma skill-ul în reflex."];
 while(good.length<3) add(good,fallbackGood[good.length]);
 while(bad.length<3) add(bad,fallbackBad[bad.length]);
 good=good.slice(0,3);bad=bad.slice(0,3);

 let overall,progress,compare="";
 if(!prev){progress="FIRST SHADOWING";overall="Evaluarea oferă un punct clar de plecare pentru următoarea evaluare."}
 else{
  progress="FOLLOW-UP SHADOWING";
  const positive=/mai bine|improvement|progres|evolu|mai okay|mai bun|descurc.*mai/.test(t);
  const negative=/mai rău|mai rau|regres|stagne|nu a progres|aceleași probleme|aceleasi probleme/.test(t);
  if(positive&&!negative){overall="Se observă improvement față de feedback-ul anterior.";compare="Improvement față de evaluarea anterioară."}
  else if(negative){overall="Progresul este limitat; problemele anterioare încă trebuie lucrate.";compare="Problemele anterioare încă apar — necesită follow-up."}
  else {overall="Skill-urile sunt în dezvoltare; următoarea evaluare va arăta consistența.";compare="Urmărim dacă punctele de mai jos devin constante."}
 }
 let a1=/empatie|gfe|tranzac/.test(t)?"Lucrăm pe empatie, GFE și conversații mai naturale.":/activitate/.test(t)?"Creăm activitate constantă prin outreach personalizat.":"Aplicăm feedback-ul direct în conversații reale.";
 let a2=/sales|vanzar|vânzar/.test(t)?"Folosim SALES pentru a controla direcția și a identifica oportunități de vânzare.":"Facem practice pe situațiile unde încă se blochează.";
 let a3=/scam|scamming/.test(t)?"Continuăm practica pe SCAMMING și scenarii reale.":/discount/.test(t)?"Evităm discounturile rapide și lucrăm pe persuasion.":"Continuăm shadowing-ul și corectarea punctuală.";

 let out=`SHADOWING FEEDBACK\n\nNume: ${name}\nEchipă: ${team}\nData: ${date}\n\nOverall:\n${overall}\n\n📈 Progress: ${progress}\n\n✅ Puncte bune\n• ${good.join("\n• ")}\n\n⚠️ De îmbunătățit\n• ${bad.join("\n• ")}\n\n🎯 Action Point\n• ${a1}\n• ${a2}\n• ${a3}`;
 if(potential)out+=`\n\n💰 Potential:\n• Target: ${potential}, în funcție de consistență și progres.`;
 else if(prev)out+=`\n\n💰 Potential:\n• Reevaluat în funcție de consistența următoarelor shadowing-uri.`;

 generated=out;generatedCompare=compare;
 document.getElementById("result").textContent=out;
 document.getElementById("status").textContent=prev?"Feedback-ul a fost comparat cu cea mai recentă evaluare anterioară.":"Primul feedback pentru acest chatter.";
 renderProfiles();renderTimeline();
}
function saveFeedback(){
 if(!generated){document.getElementById("status").textContent="Generează întâi feedback-ul.";return}
 const name=val("name"),team=val("team"),date=val("date")||today();
 let p=profile(name,team);if(!p){p={id:uid(),name,team,feedbacks:[]};data.profiles.push(p);currentId=p.id}
 const existing=p.feedbacks.find(f=>f.date===date);
 if(existing){if(!confirm("Există deja un feedback pentru această dată. Îl înlocuiești?"))return;Object.assign(existing,{result:generated,notes:val("notes"),potential:val("potential"),compare:generatedCompare})}
 else p.feedbacks.push({id:uid(),date,result:generated,notes:val("notes"),potential:val("potential"),compare:generatedCompare});
 persist();renderProfiles();renderTimeline();document.getElementById("status").textContent="Feedback salvat în istoricul chatter-ului.";
}
function copyResult(){if(!generated)return;navigator.clipboard.writeText(generated).then(()=>document.getElementById("status").textContent="Copiat.")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
renderProfiles();
</script>
</body>
</html>
