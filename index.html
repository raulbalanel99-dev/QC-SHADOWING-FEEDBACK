<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Shadowing Feedback V11</title>
<style>
:root{--bg:#0d1117;--card:#151b24;--card2:#0b1016;--border:#293241;--text:#eef2f7;--muted:#9aa6b5;--blue:#7c9cff;--green:#35d07f;--yellow:#ffbd55;--red:#ff6577}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
.app{max-width:1250px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px}.side{min-height:650px;max-height:calc(100vh - 48px);overflow:auto}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sidehead b{font-size:14px}.count{font-size:11px;color:var(--muted)}
.search,input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font:inherit;outline:none}.search{margin-bottom:10px}
.teamlist{margin-top:12px}.teamrow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:8px;cursor:pointer;margin:3px 0;color:#cbd4df}.teamrow:hover{background:#101721}.teamrow.active{background:#202a3a;color:#fff}.teamrow .teamname{font-weight:800;font-size:12px}.teamrow .teamcount{font-size:10px;color:var(--muted);margin-left:6px}.teamactions{display:flex;gap:4px}.mini{padding:4px 7px!important;font-size:10px!important;border-radius:6px!important}.teammembers{padding:2px 0 7px 12px;border-left:2px solid #293241;margin:0 0 5px 10px}.profile{padding:9px 10px;border:1px solid transparent;border-radius:9px;cursor:pointer;margin:4px 0}.profile:hover{background:#101721;border-color:var(--border)}.profile.active{background:#202a3a;border-color:#46577a}.profile b{display:block}.profile small{color:var(--muted)}.tag{display:inline-block;margin-top:5px;font-size:10px;padding:2px 6px;border-radius:20px;background:#263149;color:#b9c8ff}.profileline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.editbtn{opacity:.65}.profile:hover .editbtn{opacity:1}
label{font-size:12px;font-weight:700;color:#cbd4df;display:block;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
textarea{min-height:180px;resize:vertical;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:9px 13px;background:#273149;color:#fff;font-weight:800;cursor:pointer}button.primary{background:var(--blue);color:#08101f}button.danger{background:#3b2029;color:#ffbdc6}button.ghost{background:transparent;border:1px solid var(--border)}
.result{margin-top:14px;background:#090d12;border:1px solid var(--border);border-radius:10px;padding:17px;white-space:pre-wrap;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:280px}
.timeline{margin-top:16px}.entry{border:1px solid var(--border);border-radius:10px;background:var(--card2);margin-top:9px;overflow:hidden}.entryhead{display:flex;justify-content:space-between;padding:11px 13px;background:#121923}.entryhead b{font-size:13px}.entryhead span{font-size:11px;color:var(--muted)}.entrybody{padding:12px}.entrybody pre{white-space:pre-wrap;margin:0;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.compare{border-left:3px solid var(--blue);padding:8px 11px;margin-top:10px;color:#cbd5e5;font-size:12px}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}button:disabled{opacity:.35;cursor:not-allowed}.status{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{min-height:auto}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
 <div class="top"><div><h1>SHADOWING FEEDBACK V11</h1><p>QC history — fiecare chatter are propriul profil și timeline.</p></div></div>
 <div class="layout">
  <aside class="card side">
   <div class="sidehead"><b>Chatter History</b><span class="count" id="count">0</span></div>
   <input class="search" id="search" placeholder="Caută chatter sau echipă..." oninput="renderProfiles()">
   <button class="primary" style="width:100%" onclick="newProfile()">+ New Chatter</button>
   <div class="status" style="margin:7px 0 0">Click <b>＋</b> lângă echipă pentru a adăuga direct un chatter.</div>
   <div class="row" style="margin-top:8px">
    <button class="ghost mini" style="width:100%" onclick="manageTeams()">⚙ Manage Teams</button>
   </div>
   <div id="teams" class="teamlist"></div>
   <div id="profiles"></div>
  </aside>

  <main>
   <section class="card">
    <div class="grid">
     <div><label>Nume</label><input id="name" placeholder="ex. Dutzi"></div>
     <div><label>Echipă</label><input id="team" placeholder="ex. Outlaws"></div>
     <div><label>Data feedback</label><input id="date" type="date"></div>
     <div><label>Potential / target (opțional)</label><input id="potential" placeholder="ex. $800–$1k"></div>
     <div class="full"><label>Observațiile tale</label>
      <textarea id="notes" placeholder="Scrie liber ce ai observat. Nu trebuie să fie profesional sau structurat. Tool-ul extrage ideile și le reformulează în termeni QC/OnlyFans."></textarea>
     </div>
    </div>
    <div class="row">
      <button class="primary" onclick="generate()">Generează</button>
      <button onclick="saveProfile()">Save Chatter</button>
      <button onclick="saveFeedback()">Save Feedback</button>
      <button class="ghost" onclick="clearForm()">Clear</button>
    </div>
    <div id="status" class="status"></div>
   </section>

   <section class="card">
    <label>Rezultat</label>
    <div id="result" class="result">Aici va apărea feedback-ul.</div>
    <div class="row"><button onclick="copyResult()">Copy</button></div>
   </section>

   <section class="card timeline">
    <div class="sidehead"><b id="timelineTitle">Istoric chatter</b><span class="count" id="timelineCount"></span></div>
    <div id="timeline" class="empty">Selectează un chatter din stânga.</div>
   </section>
  </main>
 </div>
</div>

<script>
const KEY="QC_SHADOWING_V11_DATA";
const OLD_KEY="QC_SHADOWING_V7_DATA";
let data=load(), currentId=null, currentTeam="ALL", generated="", generatedCompare="";

function load(){
  const keys=["QC_SHADOWING_V11_DATA","QC_SHADOWING_V10_DATA","QC_SHADOWING_V9_DATA","QC_SHADOWING_V8_DATA","QC_SHADOWING_V7_DATA","QC_SHADOWING_V6_DATA"];
  for(const key of keys){
    try{
      const saved=JSON.parse(localStorage.getItem(key)||"");
      if(saved && Array.isArray(saved.profiles)){
        const migrated=normalize(saved);
        // Preserve the known existing profiles if an older version moved them to Unassigned.
        migrated.profiles.forEach(p=>{
          const n=(p.name||"").trim().toLowerCase();
          if(n==="dutzi" && (!p.team || p.team.toLowerCase()==="unassigned")) p.team="Outlaws";
          if(n==="monu" && (!p.team || p.team.toLowerCase()==="unassigned")) p.team="Werewolves";
        });
        ["Outlaws","Werewolves","Unassigned"].forEach(t=>{
          if(!migrated.teams.includes(t)) migrated.teams.push(t);
        });
        localStorage.setItem("QC_SHADOWING_V11_DATA",JSON.stringify(migrated));
        return migrated;
      }
    }catch(e){}
  }
  return {profiles:[],teams:["Rockstars","Vampires","Outlaws","Werewolves","Vultures","Rebels","Firestarters","Mobsters","Misfits","Racoons","Lovers","Unassigned"]};
}

function normalize(d){
  d={...d};
  d.profiles=(d.profiles||[]).map(p=>({
    ...p,
    id:p.id||uid(),
    name:p.name||"",
    team:p.team||"Unassigned",
    feedbacks:Array.isArray(p.feedbacks)?p.feedbacks:[]
  }));
  let teams=Array.isArray(d.teams)?[...d.teams]:[];
  d.profiles.forEach(p=>{if(p.team && !teams.includes(p.team))teams.push(p.team)});
  if(!teams.length) teams=["Unassigned"];
  d.teams=[...new Set(teams.filter(Boolean))];
  return d;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function val(id){return document.getElementById(id).value.trim()}
function set(id,v){document.getElementById(id).value=v||""}
function today(){return new Date().toISOString().slice(0,10)}
document.getElementById("date").value=today();

function profile(name,team){
 return data.profiles.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.team.toLowerCase()===team.toLowerCase())
}
function getCurrent(){return data.profiles.find(p=>p.id===currentId)}
function newProfile(teamName=""){
  const team=(teamName||"").trim();
  if(team){
    const count=data.profiles.filter(p=>p.team.toLowerCase()===team.toLowerCase()).length;
    if(count>=3){document.getElementById("status").textContent=`${team} este plină (3/3).`;return;}
    const name=prompt(`Adaugă chatter în ${team}:`);
    if(!name || !name.trim()) return;
    const clean=name.trim();
    const duplicate=data.profiles.find(p=>p.name.toLowerCase()===clean.toLowerCase() && p.team.toLowerCase()===team.toLowerCase());
    if(duplicate){alert("Chatterul există deja în această echipă.");return;}
    const p={id:uid(),name:clean,team,feedbacks:[]};
    data.profiles.push(p);
    currentId=p.id;
    currentTeam=team;
    persist();renderTeams();renderProfiles();renderTimeline();
    set("name",p.name);set("team",p.team);set("date",today());set("potential","");set("notes","");
    generated="";generatedCompare="";
    document.getElementById("result").textContent="Aici va apărea feedback-ul.";
    document.getElementById("status").textContent=`${clean} a fost adăugat în ${team}.`;
    return;
  }
  currentId=null;clearForm();
  currentTeam="ALL";
  renderTeams();renderProfiles();renderTimeline();
  document.getElementById("name").focus();
  document.getElementById("status").textContent="New chatter — completează numele și echipa, apoi Save Chatter.";
}
function clearForm(){
 set("name","");set("team","");set("date",today());set("potential","");set("notes","");
 generated="";generatedCompare="";
 document.getElementById("result").textContent="Aici va apărea feedback-ul.";
 document.getElementById("status").textContent="";
}
function openProfile(id){
 currentId=id; const p=getCurrent(); if(!p)return;
 set("name",p.name);set("team",p.team);set("date",today());set("potential","");
 set("notes","");generated="";
 document.getElementById("result").textContent="Aici va apărea feedback-ul.";
 document.getElementById("status").textContent="Profil încărcat. Poți edita numele sau echipa și salva modificarea.";
 renderTeams();renderProfiles();renderTimeline();
}
function editProfile(id){
 const p=data.profiles.find(x=>x.id===id); if(!p)return;
 currentId=id; set("name",p.name); set("team",p.team); set("date",today()); set("potential",""); set("notes","");
 generated="";generatedCompare="";
 document.getElementById("result").textContent="Aici va apărea feedback-ul.";
 document.getElementById("status").textContent="Edit mode — modifică numele/echipa, apoi apasă Save Profile.";
 renderTeams();renderProfiles();renderTimeline();
 document.getElementById("name").focus();
}
function saveProfile(){
 const p=getCurrent(), name=val("name"), team=val("team");
 if(!name||!team){document.getElementById("status").textContent="Numele și echipa sunt obligatorii.";return}
 const members=data.profiles.filter(x=>x.id!==currentId && x.team.toLowerCase()===team.toLowerCase());
 if(members.length>=3 && (!p || p.team.toLowerCase()!==team.toLowerCase())){
   document.getElementById("status").textContent=`Echipa ${team} are deja 3 chatteri.`;
   return;
 }
 const duplicate=data.profiles.find(x=>x.id!==currentId && x.name.toLowerCase()===name.toLowerCase() && x.team.toLowerCase()===team.toLowerCase());
 if(duplicate){document.getElementById("status").textContent="Există deja un chatter cu acest nume în această echipă.";return}
 if(!p){
   currentId=uid();
   data.profiles.push({id:currentId,name,team,feedbacks:[]});
 }else{
   p.name=name; p.team=team;
 }
 const existingTeam=data.teams.find(t=>t.toLowerCase()===team.toLowerCase());
 if(!existingTeam) data.teams.push(team);
 else if(existingTeam!==team){
   // Keep one canonical team name and update all assigned profiles.
   data.profiles.forEach(x=>{if(x.team===team)x.team=existingTeam});
   const savedP=getCurrent(); if(savedP) savedP.team=existingTeam;
   team=existingTeam;
 }
 currentTeam=team;
 persist();renderTeams();renderProfiles();renderTimeline();
 document.getElementById("status").textContent="Chatter salvat.";
}
function addTeam(){
 const name=prompt("Nume echipă nouă:");
 if(!name)return;
 const clean=name.trim();
 if(!clean)return;
 if(data.teams.some(t=>t.toLowerCase()===clean.toLowerCase())){alert("Echipa există deja.");return}
 data.teams.push(clean);persist();currentTeam=clean;renderTeams();renderProfiles();
}
function renameTeam(oldName){
 const next=prompt("Noul nume pentru echipa:",oldName);
 if(!next)return;
 const clean=next.trim();
 if(!clean || clean.toLowerCase()===oldName.toLowerCase())return;
 if(data.teams.some(t=>t.toLowerCase()===clean.toLowerCase())){alert("Există deja o echipă cu acest nume.");return}
 data.profiles.forEach(p=>{if(p.team===oldName)p.team=clean});
 data.teams=data.teams.map(t=>t===oldName?clean:t);
 if(currentTeam===oldName)currentTeam=clean;
 persist();renderTeams();renderProfiles();renderTimeline();
}
function deleteTeam(name){
 const members=data.profiles.filter(p=>p.team===name);
 const msg=members.length
   ? `Echipa "${name}" are ${members.length} chatter${members.length===1?"":"i"}. Ștergerea echipei îi va muta la "Unassigned". Continui?`
   : `Ștergi echipa "${name}"?`;
 if(!confirm(msg))return;
 data.profiles.forEach(p=>{if(p.team===name)p.team="Unassigned"});
 data.teams=data.teams.filter(t=>t!==name);
 if(!data.teams.includes("Unassigned"))data.teams.push("Unassigned");
 if(currentTeam===name)currentTeam="ALL";
 persist();renderTeams();renderProfiles();renderTimeline();
}
function manageTeams(){
 const action=prompt("Scrie:\n1 = adaugă echipă\n2 = redenumește o echipă\n3 = șterge o echipă");
 if(action==="1")addTeam();
 else if(action==="2"){
   const old=prompt("Echipa de redenumit:\n\n"+data.teams.join("\n"));
   if(old && data.teams.includes(old))renameTeam(old);
   else if(old)alert("Echipa nu a fost găsită.");
 }else if(action==="3"){
   const old=prompt("Echipa de șters:\n\n"+data.teams.join("\n"));
   if(old && data.teams.includes(old))deleteTeam(old);
   else if(old)alert("Echipa nu a fost găsită.");
 }
}

function profileMarkup(p){
 return `<div class="profile ${p.id===currentId?'active':''}" onclick="openProfile('${p.id}')">
   <div class="profileline">
     <div><b>${esc(p.name)}</b><small>${esc(p.team)}</small></div>
     <button class="ghost mini editbtn" onclick="event.stopPropagation();editProfile('${p.id}')" title="Editează chatter">✎</button>
   </div>
   <span class="tag">${p.feedbacks.length} feedback${p.feedbacks.length===1?'':'uri'}</span>
 </div>`;
}

function renderTeams(){
 const box=document.getElementById("teams");
 const q=document.getElementById("search").value.toLowerCase().trim();

 // "Toate echipele" counts teams, not chatter profiles. Unassigned is kept separate.
 const realTeams=data.teams.filter(t=>t.toLowerCase()!=="unassigned");
 const visibleTeams=realTeams.filter(t=>{
   if(!q) return true;
   if(t.toLowerCase().includes(q)) return true;
   return data.profiles.some(p=>p.team===t && p.name.toLowerCase().includes(q));
 });

 let out=`<div class="teamrow ${currentTeam==="ALL"?'active':''}" onclick="selectTeam('ALL')">
   <span><span class="teamname">Toate echipele</span><span class="teamcount">${realTeams.length}</span></span>
 </div>`;

 visibleTeams.forEach(team=>{
   const members=data.profiles.filter(p=>p.team===team)
     .filter(p=>!q || team.toLowerCase().includes(q) || p.name.toLowerCase().includes(q))
     .sort((a,b)=>a.name.localeCompare(b.name));
   const count=data.profiles.filter(p=>p.team===team).length;
   const expanded=currentTeam===team;
   const canAdd=count<3;

   out+=`<div class="teamrow ${expanded?'active':''}" onclick="selectTeam('${escAttr(team)}')">
      <span><span class="teamname">${esc(team)}</span><span class="teamcount">${count} / 3</span></span>
      <span class="teamactions">
        <button class="ghost mini" onclick="event.stopPropagation();newProfile('${escAttr(team)}')" title="${canAdd?"Adaugă chatter":"Echipa are deja 3 chatteri"}" ${canAdd?"":"disabled"}>＋</button>
        <button class="ghost mini" onclick="event.stopPropagation();renameTeam('${escAttr(team)}')" title="Redenumește">✎</button>
        <button class="danger mini" onclick="event.stopPropagation();deleteTeam('${escAttr(team)}')" title="Șterge">×</button>
      </span>
   </div>`;

   if(expanded){
     out+=`<div class="teammembers">`;
     if(members.length){
       out+=members.map(profileMarkup).join("");
     }else{
       out+=`<div class="empty" style="padding:7px 2px">Niciun chatter în această echipă.</div>`;
     }
     if(canAdd){
       out+=`<button class="ghost" style="width:100%;margin:4px 0 5px" onclick="newProfile('${escAttr(team)}')">＋ Adaugă chatter (${count}/3)</button>`;
     }
     out+=`</div>`;
   }
 });

 // Keep Unassigned available for profiles that have not yet been assigned.
 const unassigned=data.profiles.filter(p=>p.team.toLowerCase()==="unassigned");
 if((!q || "unassigned".includes(q)) && data.teams.some(t=>t.toLowerCase()==="unassigned")){
   const expanded=currentTeam==="Unassigned";
   out+=`<div class="teamrow ${expanded?'active':''}" onclick="selectTeam('Unassigned')">
      <span><span class="teamname">Unassigned</span><span class="teamcount">${unassigned.length} / 3</span></span>
      <span class="teamactions">
        <button class="ghost mini" onclick="event.stopPropagation();newProfile('Unassigned')" ${unassigned.length>=3?'disabled':''}>＋</button>
        <button class="ghost mini" onclick="event.stopPropagation();renameTeam('Unassigned')">✎</button>
      </span>
   </div>`;
   if(expanded){
     out+=`<div class="teammembers">${unassigned.length?unassigned.map(profileMarkup).join(""):'<div class="empty">Niciun chatter.</div>'}</div>`;
   }
 }

 if(q && !visibleTeams.length && !unassigned.length){
   out+=`<div class="empty">Nicio echipă sau niciun chatter găsit.</div>`;
 }
 box.innerHTML=out;

 // The old separate profile area is no longer used: chatterii are shown directly under their team.
 const oldProfiles=document.getElementById("profiles");
 if(oldProfiles) oldProfiles.innerHTML="";
 document.getElementById("count").textContent=data.profiles.length;
}

function renderProfiles(){
 renderTeams();
}

function selectTeam(team){
 currentTeam=team;
 renderTeams();
 // If a chatter was selected in another team, keep it selected but don't force the list open.
 renderTimeline();
}

function renderTimeline(){
 const p=getCurrent(), box=document.getElementById("timeline");
 if(!p){document.getElementById("timelineTitle").textContent="Istoric chatter";document.getElementById("timelineCount").textContent="";box.innerHTML='<div class="empty">Selectează un chatter din stânga.</div>';return}
 document.getElementById("timelineTitle").textContent=`${p.name} — ${p.team}`;
 document.getElementById("timelineCount").textContent=`${p.feedbacks.length} evaluări`;
 if(!p.feedbacks.length){box.innerHTML='<div class="empty">Nu există feedback-uri încă.</div>';return}
 const fs=[...p.feedbacks].sort((a,b)=>b.date.localeCompare(a.date));
 box.innerHTML=fs.map((f,i)=>`<div class="entry"><div class="entryhead"><b>${esc(f.date)}</b><span>${i===fs.length-1?'FIRST / oldest':''}</span></div><div class="entrybody"><pre>${esc(f.result)}</pre>${f.compare?`<div class="compare">↗ ${esc(f.compare)}</div>`:''}</div></div>`).join("");
}

function generate(){
 const name=val("name"),team=val("team"),notes=val("notes"),date=val("date")||today(),potential=val("potential");
 if(!name||!team||!notes){document.getElementById("status").textContent="Completează numele, echipa și observațiile.";return}
 let p=getCurrent();
 if(p && p.name.toLowerCase()===name.toLowerCase()){
   // Editing an existing selected profile: preserve its feedback history.
   p.name=name;
   p.team=team;
 }else{
   p=profile(name,team);
   if(!p){
     const teamCount=data.profiles.filter(x=>x.team.toLowerCase()===team.toLowerCase()).length;
     if(teamCount>=3){document.getElementById("status").textContent=`Echipa ${team} are deja 3 chatteri.`;return}
     p={id:uid(),name,team,feedbacks:[]};data.profiles.push(p);
   }
 }
 currentId=p.id;
 if(!data.teams.includes(team)){data.teams.push(team);persist()}
 const t=notes.toLowerCase(), prev=[...p.feedbacks].sort((a,b)=>b.date.localeCompare(a.date)).find(x=>x.date<date);
 let good=[],bad=[];
 const add=(arr,x)=>{if(!arr.includes(x))arr.push(x)};
 if(/rapid|repede|timely|la timp|timp util/.test(t))add(good,"Răspunde rapid și menține conversațiile active.");
 if(/follow.?up/.test(t))add(good,"Folosește follow-up-urile bine și revine la fanii activi.");
 if(/receptiv|ascult|implemente|baga la cap|învață|invata/.test(t))add(good,"Este receptiv la feedback și aplică rapid corecțiile.");
 if(/gfe|empatie|personalizat|creativ/.test(t))add(good,"Construiește conexiune și folosește GFE/personalizare.");
 if(/priorit|platitor|plătitor|vip|spender/.test(t))add(good,"Înțelege mai bine prioritizarea fanilor și alocă efortul corect.");
 if(/script/.test(t))add(good,"Folosește scripturile ca suport și le adaptează mai bine conversației.");
 if(/sales|vanzar|vânzar|ppv|obj|obiectiv/.test(t))add(good,"Are o direcție mai bună pe flow, OBJ și zona de sales.");
 if(/activitate|activ\b|mesaje personalizate/.test(t))add(good,"Creează activitate și caută oportunități de engagement.");

 if(/inactiv|nu prea a fost activitate|fără activitate|fara activitate/.test(t))add(bad,"Trebuie să creeze mai multă activitate la începutul turei.");
 if(/empatie|gfe|creativitate|din cap|tranzacțional|tranzactional/.test(t))add(bad,"Trebuie să fie mai natural, empatic și mai puțin tranzacțional.");
 if(/sales|vanzar|vânzar/.test(t))add(bad,"Trebuie să folosească SALES pentru a controla mai bine direcția conversației.");
 if(/nu deschide sales|nu prea deschide sales/.test(t))add(bad,"Trebuie să verifice SALES înainte de a urma strict flow-ul fanului.");
 if(/scam|scamming/.test(t))add(bad,"Mai are nevoie de practică pe scenarii de SCAMMING.");
 if(/manipul|conving|obiec/.test(t))add(bad,"Mai are nevoie de lucru pe persuasion și gestionarea obiecțiilor.");
 if(/discount|reducere/.test(t))add(bad,"Să evite discountul ca soluție rapidă pentru închiderea vânzării.");
 if(/se pierde|bloche|frica|teamă|teama|overwhelmed/.test(t))add(bad,"Mai are nevoie de consistență când conversația devine dificilă.");
 if(/adapt/.test(t))add(bad,"Trebuie să adapteze mai bine conversația la fan.");

 const fallbackGood=["Are o bază bună de lucru.","Se adaptează din ce în ce mai bine la workflow.","Are o evoluție pozitivă."];
 const fallbackBad=["Mai are nevoie de consistență în situațiile dificile.","Trebuie să adapteze mai bine conversația la fan.","Mai este nevoie de practică pentru a transforma skill-ul în reflex."];
 while(good.length<3) add(good,fallbackGood[good.length]);
 while(bad.length<3) add(bad,fallbackBad[bad.length]);
 good=good.slice(0,3);bad=bad.slice(0,3);

 let overall,progress,compare="";
 if(!prev){progress="FIRST SHADOWING";overall="Evaluarea oferă un punct clar de plecare pentru următoarea evaluare."}
 else{
  progress="FOLLOW-UP SHADOWING";
  const positive=/mai bine|improvement|progres|evolu|mai okay|mai bun|descurc.*mai/.test(t);
  const negative=/mai rău|mai rau|regres|stagne|nu a progres|aceleași probleme|aceleasi probleme/.test(t);
  if(positive&&!negative){overall="Se observă improvement față de feedback-ul anterior.";compare="Improvement față de evaluarea anterioară."}
  else if(negative){overall="Progresul este limitat; problemele anterioare încă trebuie lucrate.";compare="Problemele anterioare încă apar — necesită follow-up."}
  else {overall="Skill-urile sunt în dezvoltare; următoarea evaluare va arăta consistența.";compare="Urmărim dacă punctele de mai jos devin constante."}
 }
 let a1=/empatie|gfe|tranzac/.test(t)?"Lucrăm pe empatie, GFE și conversații mai naturale.":/activitate/.test(t)?"Creăm activitate constantă prin outreach personalizat.":"Aplicăm feedback-ul direct în conversații reale.";
 let a2=/sales|vanzar|vânzar/.test(t)?"Folosim SALES pentru a controla direcția și a identifica oportunități de vânzare.":"Facem practice pe situațiile unde încă se blochează.";
 let a3=/scam|scamming/.test(t)?"Continuăm practica pe SCAMMING și scenarii reale.":/discount/.test(t)?"Evităm discounturile rapide și lucrăm pe persuasion.":"Continuăm shadowing-ul și corectarea punctuală.";

 let out=`SHADOWING FEEDBACK\n\nNume: ${name}\nEchipă: ${team}\nData: ${date}\n\nOverall:\n${overall}\n\n📈 Progress: ${progress}\n\n✅ Puncte bune\n• ${good.join("\n• ")}\n\n⚠️ De îmbunătățit\n• ${bad.join("\n• ")}\n\n🎯 Action Point\n• ${a1}\n• ${a2}\n• ${a3}`;
 if(potential)out+=`\n\n💰 Potential:\n• Target: ${potential}, în funcție de consistență și progres.`;
 else if(prev)out+=`\n\n💰 Potential:\n• Reevaluat în funcție de consistența următoarelor shadowing-uri.`;

 generated=out;generatedCompare=compare;
 document.getElementById("result").textContent=out;
 document.getElementById("status").textContent=prev?"Feedback-ul a fost comparat cu cea mai recentă evaluare anterioară.":"Primul feedback pentru acest chatter.";
 renderTeams();renderProfiles();renderTimeline();
}

function saveFeedback(){
 if(!generated){document.getElementById("status").textContent="Generează întâi feedback-ul.";return}
 const name=val("name"),team=val("team"),date=val("date")||today();
 let p=profile(name,team);
 if(!p){
   const teamCount=data.profiles.filter(x=>x.team.toLowerCase()===team.toLowerCase()).length;
   if(teamCount>=3){document.getElementById("status").textContent=`Echipa ${team} are deja 3 chatteri.`;return}
   p={id:uid(),name,team,feedbacks:[]};data.profiles.push(p);currentId=p.id
 }
 if(!data.teams.includes(team))data.teams.push(team);
 const existing=p.feedbacks.find(f=>f.date===date);
 if(existing){if(!confirm("Există deja un feedback pentru această dată. Îl înlocuiești?"))return;Object.assign(existing,{result:generated,notes:val("notes"),potential:val("potential"),compare:generatedCompare})}
 else p.feedbacks.push({id:uid(),date,result:generated,notes:val("notes"),potential:val("potential"),compare:generatedCompare});
 persist();renderTeams();renderProfiles();renderTimeline();document.getElementById("status").textContent="Feedback salvat în istoricul chatter-ului.";
}

function copyResult(){if(!generated)return;navigator.clipboard.writeText(generated).then(()=>document.getElementById("status").textContent="Copiat.")}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escAttr(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
renderTeams();renderProfiles();
</script>
