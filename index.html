<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QC Shadowing Feedback V9</title>
<style>
:root{--bg:#0d1117;--card:#151b24;--card2:#0b1016;--border:#293241;--text:#eef2f7;--muted:#9aa6b5;--blue:#7c9cff;--green:#35d07f;--yellow:#ffbd55;--red:#ff6577}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}
.app{max-width:1250px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px}.side{min-height:650px}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sidehead b{font-size:14px}.count{font-size:11px;color:var(--muted)}
.search,input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;font:inherit;outline:none}.search{margin-bottom:10px}
.teamlist{margin-top:12px}.teamrow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:8px;cursor:pointer;margin:3px 0;color:#cbd4df}.teamrow:hover{background:#101721}.teamrow.active{background:#202a3a;color:#fff}.teamrow .teamname{font-weight:800;font-size:12px}.teamrow .teamcount{font-size:10px;color:var(--muted);margin-left:6px}.teamactions{display:flex;gap:4px}.mini{padding:4px 7px!important;font-size:10px!important;border-radius:6px!important}.profile{padding:11px;border:1px solid transparent;border-radius:9px;cursor:pointer;margin:5px 0}.profile:hover{background:#101721;border-color:var(--border)}.profile.active{background:#202a3a;border-color:#46577a}.profile b{display:block}.profile small{color:var(--muted)}.tag{display:inline-block;margin-top:5px;font-size:10px;padding:2px 6px;border-radius:20px;background:#263149;color:#b9c8ff}.profileline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.editbtn{opacity:.65}.profile:hover .editbtn{opacity:1}
label{font-size:12px;font-weight:700;color:#cbd4df;display:block;margin:0 0 6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
textarea{min-height:180px;resize:vertical;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:9px 13px;background:#273149;color:#fff;font-weight:800;cursor:pointer}button.primary{background:var(--blue);color:#08101f}button.danger{background:#3b2029;color:#ffbdc6}button.ghost{background:transparent;border:1px solid var(--border)}
.result{margin-top:14px;background:#090d12;border:1px solid var(--border);border-radius:10px;padding:17px;white-space:pre-wrap;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:280px}
.timeline{margin-top:16px}.entry{border:1px solid var(--border);border-radius:10px;background:var(--card2);margin-top:9px;overflow:hidden}.entryhead{display:flex;justify-content:space-between;padding:11px 13px;background:#121923}.entryhead b{font-size:13px}.entryhead span{font-size:11px;color:var(--muted)}.entrybody{padding:12px}.entrybody pre{white-space:pre-wrap;margin:0;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace}.compare{border-left:3px solid var(--blue);padding:8px 11px;margin-top:10px;color:#cbd5e5;font-size:12px}.review{border:1px solid var(--border);border-radius:10px;background:#101721;padding:13px;margin:10px 0 12px}.review h3{margin:0 0 8px;font-size:13px}.review .trend{font-weight:900;margin-bottom:8px}.reviewgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.reviewitem{background:#0b1016;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:11px}.reviewitem b{display:block;margin-bottom:3px}.reviewnote{color:var(--muted);font-size:11px;margin-top:9px}.goodtxt{color:var(--green)}.badtxt{color:var(--red)}.neutral{color:var(--yellow)}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}.status{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{min-height:auto}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
 <div class="top"><div><h1>SHADOWING FEEDBACK V11</h1><p>QC history — fiecare chatter are propriul profil și timeline.</p></div></div>
 <div class="layout">
  <aside class="card side">
   <div class="sidehead"><b>Chatter History</b><span class="count" id="count">0</span></div>
   <input class="search" id="search" placeholder="Caută chatter sau echipă..." oninput="renderProfiles()">
   <button class="primary" style="width:100%" onclick="newProfile()">+ New Chatter</button>
   <div class="row" style="margin-top:8px">
    <button class="ghost mini" style="width:100%" onclick="manageTeams()">⚙ Manage Teams</button>
   </div>
   <div id="teams" class="teamlist"></div>
   <div id="profiles"></div>
  </aside>

  <main>
   <section class="card">
    <div class="grid">
     <div><label>Nume</label><input id="name" placeholder="ex. Dutzi"></div>
     <div><label>Echipă</label><input id="team" placeholder="ex. Outlaws"></div>
     <div><label>Data feedback</label><input id="date" type="date"></div>
     <div><label>Potential / target (opțional)</label><input id="potential" placeholder="ex. $800–$1k"></div>
     <div class="full"><label>Observațiile tale</label>
      <textarea id="notes" placeholder="Scrie liber ce ai observat. Nu trebuie să fie profesional sau structurat. Tool-ul extrage ideile și le reformulează în termeni QC/OnlyFans."></textarea>
     </div>
    </div>
    <div class="row">
      <button class="primary" onclick="generate()">Generează</button>
      <button onclick="saveFeedback()">Save Feedback</button>
      <button class="ghost" onclick="saveProfileTeam()">Save Profile</button>
      <button class="ghost" onclick="clearForm()">Clear</button>
    </div>
    <div id="status" class="status"></div>
   </section>

   <section class="card">
    <label>Rezultat</label>
    <div id="result" class="result">Aici va apărea feedback-ul.</div>
    <div class="row"><button onclick="copyResult()">Copy</button></div>
   </section>

   <section class="card timeline">
    <div class="sidehead"><b id="timelineTitle">Istoric chatter</b><span class="count" id="timelineCount"></span></div>
    <div id="progressReview"></div>
    <div id="timeline" class="empty">Selectează un chatter din stânga.</div>
   </section>
  </main>
 </div>
</div>

<script>
// SHADOWING FEEDBACK V11 — Supabase shared database
// IMPORTANT: add your Supabase Project URL and Publishable/Anon key below.
const SUPABASE_URL = "https://upxqwegmzypiqvuskxbq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_40WLnJy6EASmv2bFQo4JAA_-kZVt-VT";
const sb = (SUPABASE_URL.startsWith("http") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_"))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let data={teams:[],profiles:[]}, currentId=null, currentTeam="ALL", generated="";

function uid(){return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)}
function val(id){return document.getElementById(id).value.trim()}
function set(id,v){document.getElementById(id).value=v??""}
function today(){return new Date().toISOString().slice(0,10)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#039;"}[m]))}
function escAttr(s){return String(s??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'")}
function setStatus(msg){document.getElementById("status").textContent=msg||""}
function cleanText(s){return String(s||"").replace(/\s+/g," ").trim()}
function sentences(text){return String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean)}
function getCurrent(){return data.profiles.find(p=>p.id===currentId)}
function profile(name,team){return data.profiles.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.team.toLowerCase()===team.toLowerCase())}

async function loadRemote(){
  if(!sb){setStatus("Supabase nu este configurat. Completează URL + Publishable/Anon Key în fișier.");return false}
  const [{data:teams,error:te},{data:chatters,error:ce}]=await Promise.all([
    sb.from("teams").select("id,name,created_at").order("created_at",{ascending:true}),
    sb.from("chatters").select("id,name,team_id,created_at").order("created_at",{ascending:true})
  ]);
  if(te||ce){console.error(te||ce);setStatus("Nu pot încărca echipele/chatterii din Supabase: "+(te?.message||ce?.message||"eroare"));return false}
  const teamMap=new Map((teams||[]).map(t=>[t.id,t]));
  const ids=(chatters||[]).map(c=>c.id);
  let feedbacks=[];
  if(ids.length){
    // IMPORTANT: these are the real columns in the existing feedbacks table.
    const {data:f,error:fe}=await sb.from("feedbacks")
      .select("chatter_id,team_id,feedback_date,observations,generated_feedback,created_at")
      .in("chatter_id",ids)
      .order("feedback_date",{ascending:true});
    if(fe){console.error(fe);setStatus("Nu pot încărca feedback-urile: "+fe.message);return false}
    feedbacks=f||[];
  }
  const by=new Map();(chatters||[]).forEach(c=>by.set(c.id,[]));
  feedbacks.forEach(f=>by.get(f.chatter_id)?.push({date:f.feedback_date,notes:f.observations||"",result:f.generated_feedback||"",teamId:f.team_id||null,createdAt:f.created_at||null}));
  data={
    teams:(teams||[]).map(t=>t.name),
    profiles:(chatters||[]).map(c=>({id:c.id,name:c.name,team:teamMap.get(c.team_id)?.name||"Unassigned",teamId:c.team_id,feedbacks:by.get(c.id)||[]}))
  };
  return true;
}

async function init(){
  set("date",today());
  if(!sb){renderAll();return}
  await loadRemote();renderAll();setStatus("Datele sunt sincronizate cu baza comună.");
}

function renderAll(){renderTeams();renderProfiles();renderTimeline()}
function newProfile(){
  const team=prompt("În ce echipă îl adaugi?\n\n"+data.teams.join("\n"));
  if(!team)return;
  const found=data.teams.find(t=>t.toLowerCase()===team.trim().toLowerCase());
  if(found)addChatter(found);else alert("Echipa nu există. Creeaz-o din Manage Teams.");
}
function clearForm(){set("name","");set("team","");set("date",today());set("potential","");set("notes","");generated="";document.getElementById("result").textContent="Aici va apărea feedback-ul.";setStatus("")}
function openProfile(id){
  currentId=id;const p=getCurrent();if(!p)return;
  set("name",p.name);set("team",p.team);set("date",today());set("potential","");set("notes","");generated="";
  document.getElementById("result").textContent="Aici va apărea feedback-ul.";setStatus("Profil încărcat. Scrie observațiile și apasă Generează.");renderAll();
}

async function getTeamId(name){
  const {data:t,error}=await sb.from("teams").select("id").eq("name",name).single();
  if(error){alert("Nu am găsit echipa: "+error.message);return null}return t.id;
}
async function addChatter(teamName){
  if(!sb){alert("Supabase nu este configurat în index.html.");return}
  const team=data.teams.find(t=>t.toLowerCase()===teamName.toLowerCase());if(!team)return;
  const members=data.profiles.filter(p=>p.team===team);
  if(members.length>=3){alert(`Echipa ${team} are deja 3/3 chatteri.`);return}
  const name=prompt(`Numele chatter-ului pentru ${team}:`);if(!name)return;
  const clean=name.trim();if(!clean)return;
  if(members.some(p=>p.name.toLowerCase()===clean.toLowerCase())){alert("Acest chatter există deja în echipă.");return}
  const teamId=await getTeamId(team);if(!teamId)return;
  const {error}=await sb.from("chatters").insert({name:clean,team_id:teamId});
  if(error){alert("Nu am putut adăuga chatter-ul: "+error.message);return}
  await loadRemote();currentTeam=team;renderAll();setStatus(`${clean} a fost adăugat în ${team}.`);
}
async function editProfile(id){
  if(!sb)return;
  const p=data.profiles.find(x=>x.id===id);if(!p)return;
  const newName=prompt("Modifică numele chatter-ului:",p.name);if(newName===null)return;
  const clean=newName.trim();if(!clean||clean===p.name)return;
  if(data.profiles.some(x=>x.id!==id&&x.name.toLowerCase()===clean.toLowerCase()&&x.team===p.team)){alert("Există deja acest chatter în echipă.");return}
  const {error}=await sb.from("chatters").update({name:clean}).eq("id",id);
  if(error){alert("Nu am putut modifica numele: "+error.message);return}
  await loadRemote();currentId=id;renderAll();setStatus("Numele chatter-ului a fost actualizat pentru toată echipa.");
}
async function saveProfileTeam(){
  if(!sb)return false;
  const p=getCurrent(),name=val("name"),team=val("team");if(!p){setStatus("Selectează un chatter existent.");return false}
  if(!name||!team){setStatus("Numele și echipa sunt obligatorii.");return false}
  const target=data.teams.find(t=>t.toLowerCase()===team.toLowerCase());if(!target){setStatus("Echipa nu există. Creeaz-o din Manage Teams.");return false}
  const teamId=await getTeamId(target);if(!teamId)return false;
  if(target!==p.team&&data.profiles.filter(x=>x.team===target).length>=3){setStatus("Echipa aleasă este deja 3/3.");return false}
  if(data.profiles.some(x=>x.id!==p.id&&x.name.toLowerCase()===name.toLowerCase()&&x.team===target)){setStatus("Există deja acest chatter în echipă.");return false}
  const {error}=await sb.from("chatters").update({name,team_id:teamId}).eq("id",p.id);
  if(error){setStatus("Eroare la actualizare: "+error.message);return false}
  await loadRemote();currentId=p.id;renderAll();setStatus("Profil actualizat pentru toată echipa.");return true;
}
async function addTeam(){
  if(!sb)return;
  const name=prompt("Nume echipă nouă:");if(!name)return;const clean=name.trim();if(!clean)return;
  if(data.teams.some(t=>t.toLowerCase()===clean.toLowerCase())){alert("Echipa există deja.");return}
  const {error}=await sb.from("teams").insert({name:clean});if(error){alert("Nu am putut crea echipa: "+error.message);return}
  await loadRemote();currentTeam=clean;renderAll();
}
async function renameTeam(oldName){
  if(!sb)return;
  const next=prompt("Noul nume pentru echipă:",oldName);if(next===null)return;const clean=next.trim();if(!clean||clean.toLowerCase()===oldName.toLowerCase())return;
  if(data.teams.some(t=>t.toLowerCase()===clean.toLowerCase())){alert("Există deja o echipă cu acest nume.");return}
  const {data:t,error}=await sb.from("teams").select("id").eq("name",oldName).single();if(error){alert(error.message);return}
  const r=await sb.from("teams").update({name:clean}).eq("id",t.id);if(r.error){alert(r.error.message);return}
  await loadRemote();if(currentTeam===oldName)currentTeam=clean;renderAll();
}
async function deleteTeam(name){
  if(!sb)return;
  const members=data.profiles.filter(p=>p.team===name);const msg=members.length?`Echipa "${name}" are ${members.length} chatteri. Îi mut la Unassigned?`:`Ștergi echipa "${name}"?`;if(!confirm(msg))return;
  let un=await sb.from("teams").select("id").eq("name","Unassigned").maybeSingle();
  if(!un.data){const c=await sb.from("teams").insert({name:"Unassigned"}).select("id").single();if(c.error){alert(c.error.message);return}un.data=c.data}
  const old=await sb.from("teams").select("id").eq("name",name).single();if(old.error)return;
  if(members.length){const r=await sb.from("chatters").update({team_id:un.data.id}).eq("team_id",old.data.id);if(r.error){alert(r.error.message);return}}
  const r=await sb.from("teams").delete().eq("id",old.data.id);if(r.error){alert(r.error.message);return}
  await loadRemote();if(currentTeam===name)currentTeam="ALL";renderAll();
}
function manageTeams(){
  const action=prompt("Scrie:\n1 = adaugă echipă\n2 = redenumește o echipă\n3 = șterge o echipă");
  if(action==="1")addTeam();
  else if(action==="2"){const old=prompt("Echipa de redenumit:\n\n"+data.teams.join("\n"));if(old){const found=data.teams.find(t=>t.toLowerCase()===old.trim().toLowerCase());if(found)renameTeam(found)}}
  else if(action==="3"){const old=prompt("Echipa de șters:\n\n"+data.teams.join("\n"));if(old){const found=data.teams.find(t=>t.toLowerCase()===old.trim().toLowerCase());if(found)deleteTeam(found)}}
}

function renderTeams(){
  const box=document.getElementById("teams"),q=document.getElementById("search").value.toLowerCase();
  const teams=data.teams.filter(t=>!q||t.toLowerCase().includes(q)||data.profiles.some(p=>p.team===t&&p.name.toLowerCase().includes(q)));
  let html=`<div class="teamrow ${currentTeam==='ALL'?'active':''}" onclick="selectTeam('ALL')"><span><span class="teamname">Toate echipele</span><span class="teamcount">${data.profiles.length}</span></span></div>`;
  for(const t of teams){
    const members=data.profiles.filter(p=>p.team===t&&(!q||p.name.toLowerCase().includes(q)||t.toLowerCase().includes(q)));
    const expanded=currentTeam===t;
    html+=`<div class="teamrow ${expanded?'active':''}" onclick="selectTeam('${escAttr(t)}')"><span><span class="teamname">${esc(t)}</span><span class="teamcount">${members.length}/3</span></span><span class="teamactions"><button class="ghost mini" onclick="event.stopPropagation();addChatter('${escAttr(t)}')" title="Adaugă chatter">+</button><button class="ghost mini" onclick="event.stopPropagation();renameTeam('${escAttr(t)}')" title="Redenumește">✎</button><button class="danger mini" onclick="event.stopPropagation();deleteTeam('${escAttr(t)}')" title="Șterge">×</button></span></div>`;
    if(expanded){
      if(members.length){for(const p of members){html+=`<div class="profile ${p.id===currentId?'active':''}" style="margin-left:10px" onclick="openProfile('${p.id}')"><div class="profileline"><div><b>${esc(p.name)}</b><small>${esc(p.team)}</small></div><button class="ghost mini editbtn" onclick="event.stopPropagation();editProfile('${p.id}')">✎</button></div><span class="tag">${p.feedbacks.length} feedback${p.feedbacks.length===1?'':'-uri'}</span></div>`}}
      if(members.length<3)html+=`<button class="ghost" style="width:calc(100% - 10px);margin:5px 0 7px 10px" onclick="addChatter('${escAttr(t)}')">+ Adaugă chatter (${members.length}/3)</button>`;
    }
  }
  box.innerHTML=html;
}
function selectTeam(team){currentTeam=currentTeam===team&&team!=="ALL"?"ALL":team;renderTeams();renderProfiles()}
function renderProfiles(){document.getElementById("profiles").innerHTML="";document.getElementById("count").textContent=data.profiles.length}

// SOURCE-ONLY GENERATOR.
// It never creates facts such as sales, GFE, SCAMMING, skills or problems unless the user wrote them.
// The generated feedback is a faithful formatting/condensation of the user's observations.
function generate(){
  const name=val("name"),team=val("team"),notes=val("notes"),date=val("date")||today(),potential=val("potential");
  if(!name||!team||!notes){setStatus("Completează numele, echipa și observațiile.");return}
  const p=profile(name,team);if(!p){setStatus("Adaugă mai întâi chatter-ul în echipă din butonul +.");return}
  currentId=p.id;
  const lines=sentences(notes);
  const positives=[],improvements=[],actions=[];
  for(const line of lines){
    const low=line.toLowerCase();
    // We only classify a sentence when its own wording clearly indicates it.
    if(/bun|bine|calumea|pozitiv|sigur|încreder|descurc|evolu|progres|receptiv|ajutat|ușor|usor|mai puțin ajutor|mai putin ajutor|singur|singură|singura|sigură|sigura|direcție bună|directie buna|foarte bun|mai bine/.test(low)) positives.push(line);
    if(/rău|rau|problem|panicheaz|se pierde|uită|uita|nu reuș|nu reus|nevoie de|mai trebuie|dead end|complicat|dificil|greș|gres|lipsește|lipseste|mai puțin|mai putin|nu poate|nu știe|nu stie/.test(low)) improvements.push(line);
    if(/trebuie|nevoie de|continu|lucr|ajut|practice|practică|practica|învăț|invat|corect|urmăr|urmar|cu timpul/.test(low)) actions.push(line);
  }
  const unique=a=>[...new Set(a)];
  const good=unique(positives).slice(0,4), bad=unique(improvements).slice(0,4), act=unique(actions).slice(0,4);
  let overall="Evaluarea reflectă strict observațiile introduse pentru această sesiune.";
  if(/mai bine|progres|evolu|mai sigur|mai puțin ajutor|mai putin ajutor|direcție bună|directie buna/.test(notes.toLowerCase())) overall="Din observațiile introduse reiese o direcție pozitivă în aspectele menționate.";
  else if(/mai rău|mai rau|regres|stagne/.test(notes.toLowerCase())) overall="Din observațiile introduse reiese o direcție negativă în aspectele menționate.";
  let progress=p.feedbacks.length?"FOLLOW-UP SHADOWING":"FIRST SHADOWING";
  let out=`SHADOWING FEEDBACK\n\nNume: ${name}\nEchipă: ${team}\nData: ${date}\n\nOverall:\n${overall}\n\n📈 Progress: ${progress}\n\n`;
  if(good.length)out+=`✅ Puncte bune\n• ${good.join("\n• ")}\n\n`;
  if(bad.length)out+=`⚠️ De îmbunătățit\n• ${bad.join("\n• ")}\n\n`;
  if(act.length)out+=`🎯 Action Point\n• ${act.join("\n• ")}\n`;
  if(!good.length&&!bad.length&&!act.length)out+=`📝 Observații\n• ${lines.join("\n• ")}\n`;
  if(potential)out+=`\n💰 Potential:\n• Target: ${potential}`;
  generated=out;document.getElementById("result").textContent=out;setStatus("Generatorul folosește exclusiv textul introdus de tine. Nu completează cu informații externe.");renderAll();
}

function reviewFromThree(fs){
  const notes=fs.map(f=>f.notes||"").filter(Boolean);
  const joined=notes.join(" ").toLowerCase();
  const positive=notes.flatMap(sentences).filter(x=>/mai bine|progres|evolu|mai sigur|mai puțin ajutor|mai putin ajutor|direcție bună|directie buna|pozitiv|descurc/.test(x.toLowerCase()));
  const negative=notes.flatMap(sentences).filter(x=>/mai rău|mai rau|regres|stagne|panicheaz|se pierde|uită|uita|problem|nevoie de|mai trebuie|dead end|dificil|complicat/.test(x.toLowerCase()));
  let trend="🟡 STABLE",cls="neutral",summary="Cele 3 feedback-uri nu conțin suficiente formulări comparative clare pentru a declara o direcție.";
  if(/mai rău|mai rau|regres|stagne/.test(joined) && !/mai bine|progres|evolu|mai sigur/.test(joined)){trend="🔴 NEEDS ATTENTION";cls="badtxt";summary="În cele 3 feedback-uri sunt menționate semnale negative explicite."}
  else if(/mai bine|progres|evolu|mai sigur|mai puțin ajutor|mai putin ajutor/.test(joined) && !/mai rău|mai rau|regres|stagne/.test(joined)){trend="🟢 IMPROVING";cls="goodtxt";summary="În cele 3 feedback-uri sunt menționate semnale explicite de progres."}
  return {trend,cls,summary,positive,negative};
}
function renderProgressReview(p){
  const box=document.getElementById("progressReview");if(!p||p.feedbacks.length<3){box.innerHTML="";return}
  const fs=[...p.feedbacks].sort((a,b)=>a.date.localeCompare(b.date)).slice(-3),r=reviewFromThree(fs),dates=fs.map(f=>f.date).join(" → ");
  const pos=r.positive.slice(0,2).join(" ")||"Nu este menționat clar în cele 3 feedback-uri.";
  const neg=r.negative.slice(0,2).join(" ")||"Nu este menționat clar în cele 3 feedback-uri.";
  box.innerHTML=`<div class="review"><h3>📊 Progress Review — ultimele 3 feedback-uri</h3><div class="trend ${r.cls}">${r.trend}</div><div class="reviewnote">${esc(r.summary)}<br>Perioadă: ${esc(dates)}</div><div class="reviewgrid"><div class="reviewitem"><b>Semnale pozitive găsite</b>${esc(pos)}</div><div class="reviewitem"><b>Semnale negative găsite</b>${esc(neg)}</div></div><div class="reviewnote">Review-ul este calculat exclusiv din observațiile scrise în aceste 3 feedback-uri. Dacă ceva nu a fost menționat, nu este inventat.</div></div>`;
}

async function saveFeedback(){
  if(!sb){setStatus("Supabase nu este configurat în index.html.");return}
  if(!generated){setStatus("Generează întâi feedback-ul.");return}
  let p=getCurrent(),name=val("name"),team=val("team"),date=val("date")||today();
  if(!p){setStatus("Selectează chatter-ul din stânga înainte să salvezi feedback-ul.");return}
  if(p.name!==name||p.team!==team){const ok=await saveProfileTeam();if(!ok)return;p=getCurrent()}
  const teamId=p.teamId||await getTeamId(p.team);if(!teamId)return;
  const payload={chatter_id:p.id,team_id:teamId,feedback_date:date,observations:val("notes"),generated_feedback:generated};
  const existing=p.feedbacks.find(f=>f.date===date);
  let error=null;
  if(existing){
    if(!confirm("Există deja un feedback pentru această dată. Îl înlocuiești?"))return;
    // Existing table has no id column, so update by chatter + date.
    ({error}=await sb.from("feedbacks").update(payload).eq("chatter_id",p.id).eq("feedback_date",date));
  } else {
    ({error}=await sb.from("feedbacks").insert(payload));
  }
  if(error){setStatus("Eroare la salvare: "+error.message);return}
  await loadRemote();currentId=p.id;renderAll();
  const fresh=getCurrent();
  if(fresh&&fresh.feedbacks.length>=3&&fresh.feedbacks.length%3===0){setStatus("Feedback salvat. Ai ajuns la un grup complet de 3 — Progress Review-ul apare automat mai jos.");}
  else setStatus("Feedback salvat în Supabase și sincronizat pentru toată echipa.");
}
function copyResult(){if(!generated)return;navigator.clipboard.writeText(generated).then(()=>setStatus("Copiat."))}
function renderTimeline(){
  const p=getCurrent(),box=document.getElementById("timeline");
  if(!p){document.getElementById("timelineTitle").textContent="Istoric chatter";document.getElementById("timelineCount").textContent="";document.getElementById("progressReview").innerHTML="";box.innerHTML='<div class="empty">Selectează un chatter din stânga.</div>';return}
  document.getElementById("timelineTitle").textContent=`${esc(p.name)} — ${esc(p.team)}`;document.getElementById("timelineCount").textContent=`${p.feedbacks.length} evaluări`;renderProgressReview(p);
  if(!p.feedbacks.length){box.innerHTML='<div class="empty">Nu există feedback-uri încă.</div>';return}
  const fs=[...p.feedbacks].sort((a,b)=>b.date.localeCompare(a.date));
  box.innerHTML=fs.map((f,i)=>`<div class="entry"><div class="entryhead"><b>${esc(f.date)}</b><span>${i===fs.length-1?'FIRST / oldest':''}</span></div><div class="entrybody"><pre>${esc(f.result||f.notes)}</pre></div></div>`).join("");
}

window.addEventListener("beforeunload",()=>{try{localStorage.setItem("QC_SHADOWING_LAST_OPEN","1")}catch(e){}});
init();
</script>
